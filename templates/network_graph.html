{% extends "base.html" %}
{% block content %}
<script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

<div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-2xl">
    <div class="mb-6">
        <h2 class="text-2xl font-bold text-slate-100 flex items-center gap-2">
            <i class="fa-solid fa-diagram-project text-emerald-400"></i> Fraud Ring Entity Network Visualizer
        </h2>
        <p class="text-xs text-slate-400 mt-1">Interactive graph identifying linked policyholders, high-risk claims, repair vendors, and medical providers[cite: 10].</p>
    </div>
    
    <div id="network-container" class="w-full h-[550px] border border-slate-800 rounded-lg bg-slate-950"></div>
</div>

<script>
    const data = {{ graph_data | tojson }};
    const container = document.getElementById('network-container');
    const options = {
        nodes: {
            shape: 'box',
            font: { color: '#ffffff', face: 'monospace', size: 12 },
            margin: 12
        },
        edges: {
            color: { color: '#64748b' },
            font: { color: '#94a3b8', size: 10, align: 'top' }
        },
        physics: { enabled: true }
    };
    new vis.Network(container, data, options);
</script>
{% endblock %}
