{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto py-12 px-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
        <h2 class="text-2xl font-bold text-white mb-2">User Profile Settings</h2>
        <p class="text-sm text-slate-400 mb-6">Update your account credentials and personal details.</p>

        <form method="POST" action="{{ url_for('profile') }}" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Username</label>
                <input type="text" name="username" value="{{ user.username }}" required
                       class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">New Password (Optional)</label>
                <input type="password" name="password" placeholder="Leave blank to keep current password"
                       class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 text-sm">
            </div>

            <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-lg transition shadow-lg shadow-indigo-600/30 text-sm mt-4">
                Save Profile Updates
            </button>
        </form>
    </div>
</div>
{% endblock %}
