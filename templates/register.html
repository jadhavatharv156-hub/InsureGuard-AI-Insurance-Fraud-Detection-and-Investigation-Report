{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto py-8">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <div class="w-12 h-12 bg-emerald-500/10 border border-emerald-500/20 rounded-xl mx-auto flex items-center justify-center text-emerald-400">
                <i class="fa-solid fa-user-plus text-xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-100">Create Account</h2>
            <p class="text-xs text-slate-400">Register as a policyholder to evaluate claims</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Choose Username</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-3 top-3 text-slate-500 text-sm"></i>
                    <input type="text" name="username" required placeholder="Choose a username" class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Password</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3 top-3 text-slate-500 text-sm"></i>
                    <input type="password" name="password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                </div>
            </div>

            <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-xl transition shadow-lg shadow-emerald-500/10 mt-2">
                Create Account
            </button>
        </form>

        <p class="text-center text-xs text-slate-400">
            Already registered? <a href="{{ url_for('login') }}" class="text-emerald-400 hover:underline font-semibold">Sign in here</a>
        </p>
    </div>
</div>
{% endblock %}
