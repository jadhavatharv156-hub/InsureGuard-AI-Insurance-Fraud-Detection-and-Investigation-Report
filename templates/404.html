{% extends "base.html" %}

{% block content %}
<div class="max-w-xl mx-auto px-4 py-20 text-center">
    <div class="ig-errcode ig-gradient-text">404</div>
    <div class="ig-empty-icon mt-4"><i class="fa-solid fa-compass"></i></div>
    <h1 class="font-extrabold text-white mb-2">Page not found</h1>
    <p class="text-sm text-slate-400 mb-8">The page you're looking for doesn't exist or has been moved.</p>
    <div class="flex flex-wrap gap-3 justify-center">
        <a href="{{ url_for('index') }}" class="ig-btn-primary px-6 py-3 text-sm"><i class="fa-solid fa-house"></i> Back to Home</a>
        <a href="javascript:history.back()" class="ig-btn-ghost px-6 py-3 text-sm"><i class="fa-solid fa-arrow-left"></i> Go Back</a>
    </div>
</div>
{% endblock %}
